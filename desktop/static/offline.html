<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Freecord</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.75rem; text-align: center;
        /* The same face as the app: see web/src/styles.css. */
        font-family:
          'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', 'Cascadia Code', ui-monospace,
          'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        font-variant-ligatures: none;
        color: #e9ebf0;
        background:
          radial-gradient(40rem 26rem at 12% -8%, rgba(88, 101, 242, 0.16), transparent 60%),
          #0b0d12;
      }
      h1 { font-size: 1.2rem; margin: 0; }
      p { color: #9aa0ad; margin: 0; max-width: 26rem; line-height: 1.5; }
      a {
        margin-top: 0.5rem; background: #5865f2; border-radius: 8px; color: #fff;
        font-weight: 600; padding: 0.7rem 1.3rem; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="body"></p>
    <a id="retry" href="#"></a>
    <script>
      // URL and already-translated strings come by query from the main process
      // (see did-fail-load in main.ts) — one source of truth for the locale.
      const params = new URLSearchParams(location.search);
      const retry = document.getElementById('retry');
      document.getElementById('title').textContent = params.get('title') ?? '';
      document.getElementById('body').textContent = params.get('body') ?? '';
      retry.textContent = params.get('retry') ?? '';
      const url = params.get('url');
      if (url) {
        retry.href = url;
      }
    </script>
  </body>
</html>
