<!doctype html>
<!--
  The document language is en-US and the copy below is hardcoded English on
  purpose. This is the one file the i18n layer cannot reach: a crawler reads
  the HTML before React runs, so whatever is here is what search engines and
  language models see. en-US is the source-of-truth locale; the interface
  itself localizes at runtime and <RouteMeta /> rewrites the title and
  description once the app mounts.
-->
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the room paint under a phone notch and home bar
      (the CSS keeps the controls out of them with safe-area insets);
      resizes-content makes the on-screen keyboard shrink the layout, so the
      chat composer stays above it instead of under it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Freecord — free group voice, video and screen sharing, no signup</title>
    <meta
      name="description"
      content="Create a room, share the link, talk. Freecord is free and open source group voice, video, chat and screen sharing that works in the browser with no account. Media is peer-to-peer and end-to-end encrypted — there is no media server. Chat is sealed in your browser, so our server relays messages it cannot read."
    />
    <link rel="canonical" href="https://freecord.lattoshenrique.workers.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Henrique Brito" />

    <!-- Open Graph: what a link to this page looks like when it is pasted. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freecord" />
    <meta property="og:title" content="Freecord — free group voice, video and screen sharing, no signup" />
    <meta
      property="og:description"
      content="Create a room, share the link, talk. Free and open source, no account, and no media server between you and your friends."
    />
    <meta property="og:url" content="https://freecord.lattoshenrique.workers.dev/" />
    <meta property="og:image" content="https://freecord.lattoshenrique.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Freecord — guest-first rooms with voice, video, chat and screen sharing" />
    <!--
      The app serves one URL and picks the locale from the browser, so there
      are no per-locale URLs and no honest hreflang to declare. These say which
      languages the interface speaks, which is the true statement.
    -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Freecord — free group voice, video and screen sharing, no signup" />
    <meta
      name="twitter:description"
      content="Create a room, share the link, talk. Free and open source, no account, and no media server in the middle."
    />
    <meta name="twitter:image" content="https://freecord.lattoshenrique.workers.dev/og.png" />

    <!--
      Structured data. Search engines use it for rich results; language models
      use it to answer questions about what this is, which is most of what GEO
      actually means. Keep it factually identical to the prose — a model that
      catches the two disagreeing trusts neither.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://freecord.lattoshenrique.workers.dev/#website",
            "url": "https://freecord.lattoshenrique.workers.dev/",
            "name": "Freecord",
            "description": "Guest-first rooms with voice, video, chat and screen sharing. No signup, peer-to-peer media, sealed chat, no vendor.",
            "inLanguage": ["en-US", "pt-BR", "es", "zh-CN", "ja"],
            "publisher": { "@id": "https://freecord.lattoshenrique.workers.dev/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://freecord.lattoshenrique.workers.dev/#person",
            "name": "Henrique Brito",
            "url": "https://github.com/lattoshenrique"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://freecord.lattoshenrique.workers.dev/#app",
            "name": "Freecord",
            "applicationCategory": "CommunicationApplication",
            "applicationSubCategory": "Video conferencing",
            "operatingSystem": "Web browser, macOS, Windows, Linux",
            "url": "https://freecord.lattoshenrique.workers.dev/",
            "downloadUrl": "https://github.com/lattoshenrique/freecord/releases/latest",
            "softwareVersion": "0.8.0",
            "license": "https://opensource.org/licenses/MIT",
            "isAccessibleForFree": true,
            "author": { "@id": "https://freecord.lattoshenrique.workers.dev/#person" },
            "description": "Free and open source group voice, video, text chat and screen sharing in the browser. Anyone creates a room and shares the link; guests join with no account. Media travels peer-to-peer over WebRTC and is end-to-end encrypted; there is no media server, only signaling. Rooms hold up to 20 people, chat and files go peer to peer and are sealed in the browser, nothing is stored, and up to three people share their screens at once.",
            "featureList": [
              "Group voice calls with no signup",
              "Group video calls in the browser, up to 20 people",
              "Screen sharing, up to three screens at once, with selectable quality presets",
              "Ephemeral text chat with Markdown and replies, sealed in the browser and sent peer to peer",
              "Peer-to-peer file and image sharing, up to 1 GB, never through a server",
              "Peer-to-peer media, end-to-end encrypted",
              "Desktop apps for macOS, Windows and Linux that update themselves",
              "Interface in English, Portuguese, Spanish, Chinese and Japanese"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "codeRepository": "https://github.com/lattoshenrique/freecord"
          },
          {
            "@type": "FAQPage",
            "@id": "https://freecord.lattoshenrique.workers.dev/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do I need an account to use Freecord?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. You create a room and share its link, and anyone with the link joins as a guest. There is no signup, no email and no password. The link itself is the credential."
                }
              },
              {
                "@type": "Question",
                "name": "Is Freecord free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, and it is open source under the MIT license. You can read the code, fork it, or run your own instance."
                }
              },
              {
                "@type": "Question",
                "name": "Does my voice or video go through a server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "There is no media server. Voice, video and screen sharing travel directly between browsers over WebRTC in a peer-to-peer mesh, encrypted end to end by default. Our server only carries signaling and room state, so it could not watch or record you even if it wanted to. A deployment can optionally enable a TURN relay for networks that cannot establish a direct path, which forwards encrypted bytes it is unable to decrypt; the hosted service runs without TURN configured today."
                }
              },
              {
                "@type": "Question",
                "name": "How many people fit in a room?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Twenty. That is a real limit of a peer-to-peer mesh rather than a preference: each participant uploads a copy of their voice to every other participant. Voice and shared screens keep full quality at any room size, because a shared screen is relayed between participants as a tree instead of uploaded to everyone. Cameras are what adapts: in a room of six or fewer everyone can turn theirs on, and as the room grows fewer camera slots are available and each one uses less bandwidth."
                }
              },
              {
                "@type": "Question",
                "name": "Can more than one person share their screen?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, up to three at once. Each shared screen is relayed between participants as its own tree, and a dropped sharer's slot is released within seconds so the room is never stuck behind a frozen screen."
                }
              },
              {
                "@type": "Question",
                "name": "Can I send files?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Attach a file in the chat, or paste an image, and it streams directly to each person in the room over the same encrypted peer-to-peer connection as the call, never through a server. The receiver accepts first, both sides must be online, and files up to 1 GB are supported. Images preview inline."
                }
              },
              {
                "@type": "Question",
                "name": "Are chat messages stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No, and the server cannot read them either. Messages are sealed in your browser with a key that travels only in the room link's fragment, the part after the # symbol, which browsers never send to a server. Sealed text travels peer to peer between browsers; our server relays a message only for someone whose direct connection is not up yet, cannot decrypt it, and writes none of it to storage, so the chat disappears with the room. The limit is the same as the room's: anyone holding the full link holds the key and can read along."
                }
              },
              {
                "@type": "Question",
                "name": "Is the chat encrypted?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Message text is, and our server cannot read it. Each room gets a key that lives only in the room link's fragment, and messages are sealed with it in the browser before they are sent. What the seal does not hide is who spoke and when: sender names, timestamps and room membership are signaling data the server stamps and can see. There is no forward secrecy, one key serves a room for its whole life, and anyone holding the full link holds the key. Because the key is part of the URL, sharing a screen with the address bar visible also shares the key."
                }
              },
              {
                "@type": "Question",
                "name": "Is there a desktop app?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, for macOS (Intel and Apple Silicon), Windows and Linux. It wraps the same page and adds what a browser cannot provide: a native screen picker, system media permissions, computer audio in a shared screen on Windows, direct connections on a local network, and a higher bitrate ceiling for screen sharing. It checks for its own updates and never applies one without a click."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
